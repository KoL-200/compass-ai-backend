name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: compass_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U compass"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://compass:compass@localhost:5432/compass_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t compass-ai:ci .
      - name: The image must not run as root
        run: test "$(docker run --rm compass-ai:ci id -u)" != "0"
      - name: Start it and check health and headers
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://x:y@localhost:5432/z \
            -e JWT_SECRET=ci-smoke-test-secret-that-is-long-enough-0000 \
            compass-ai:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/live; then
              curl -sI http://localhost:8000/health/live | grep -i "x-content-type-options: nosniff"
              exit 0
            fi
            sleep 1
          done
          docker logs api
          exit 1

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true   # reports known-vulnerable dependencies without blocking merges; tighten later
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r requirements.txt